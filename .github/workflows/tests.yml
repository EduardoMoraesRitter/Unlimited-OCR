name: Offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install lightweight test dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile public Python entry points
        run: >-
          python -m py_compile
          infer.py
          unlimited_ocr_json.py
          examples/parse_output_to_json.py
          examples/transformers_image_to_json.py
          examples/difficult_pdf_to_json.py
